<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | SkillBarter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="dashboard.html">
      <svg class="logo-mark" viewBox="0 0 32 20" width="32" height="20" aria-hidden="true">
        <circle cx="10" cy="10" r="9" fill="var(--gold)"/>
        <circle cx="22" cy="10" r="9" fill="var(--teal)" fill-opacity=".9"/>
      </svg>
      <span>SkillBarter</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="dashboard.html">Dashboard</a>
      <a href="search.html">Find students</a>
      <a href="requests.html">Requests <span class="count" id="nav-count" hidden></span></a>
      <a href="profile.html" aria-current="page">Profile</a>
      <button type="button" class="linklike" id="logout">Log out</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="flash"></div>

  <section class="page-head">
    <h1>Your profile</h1>
    <p class="lede" id="profile-sub"></p>
  </section>

  <section class="two-col">
    <div class="panel">
      <h2>Details</h2>
      <form class="form" id="form-profile" novalidate>
        <p class="flash flash-err" role="alert" data-error hidden></p>
        <label>Full name
          <input type="text" name="name" maxlength="60" required>
        </label>
        <label>Email
          <input type="email" name="email" disabled>
        </label>
        <label>Short bio
          <input type="text" name="bio" maxlength="200" placeholder="Year, course, and when you are free to teach">
        </label>
        <button type="submit" class="btn">Save profile</button>
      </form>
    </div>

    <div class="panel">
      <h2>Your skills</h2>
      <p class="muted">You can teach</p>
      <div id="profile-offer"></div>
      <p class="muted">You want to learn</p>
      <div id="profile-want"></div>
      <p class="muted"><a href="dashboard.html">Edit skills on the dashboard</a></p>
    </div>
  </section>
</main>

<footer class="foot wrap">
  <p>Made for students who learn better together.</p>
</footer>

<script src="js/common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
