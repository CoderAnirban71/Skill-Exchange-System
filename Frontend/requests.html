<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requests | SkillBarter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="dashboard.html">
      <svg class="logo-mark" viewBox="0 0 32 20" width="32" height="20" aria-hidden="true">
        <circle cx="10" cy="10" r="9" fill="var(--gold)"/>
        <circle cx="22" cy="10" r="9" fill="var(--teal)" fill-opacity=".9"/>
      </svg>
      <span>SkillBarter</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="dashboard.html">Dashboard</a>
      <a href="search.html">Find students</a>
      <a href="requests.html" aria-current="page">Requests <span class="count" id="nav-count" hidden></span></a>
      <a href="profile.html">Profile</a>
      <button type="button" class="linklike" id="logout">Log out</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="flash"></div>

  <section class="page-head">
    <h1>Requests</h1>
  </section>

  <p class="empty" id="empty" hidden>No requests yet. <a href="search.html">Find a student</a> and send the first one.</p>

  <section class="block" id="sec-incoming" hidden>
    <h2>Waiting for your answer</h2>
    <div class="req-grid" id="list-incoming"></div>
  </section>

  <section class="block" id="sec-accepted" hidden>
    <h2>Accepted swaps</h2>
    <div class="req-grid" id="list-accepted"></div>
  </section>

  <section class="block" id="sec-sent" hidden>
    <h2>Sent by you</h2>
    <div class="req-grid" id="list-sent"></div>
  </section>

  <section class="block" id="sec-closed" hidden>
    <h2>Closed</h2>
    <div class="req-grid" id="list-closed"></div>
  </section>
</main>

<footer class="foot wrap">
  <p>Made for students who learn better together.</p>
</footer>

<script src="js/common.js"></script>
<script src="js/requests.js"></script>
</body>
</html>
