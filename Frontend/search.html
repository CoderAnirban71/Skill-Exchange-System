<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find students | SkillBarter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="dashboard.html">
      <svg class="logo-mark" viewBox="0 0 32 20" width="32" height="20" aria-hidden="true">
        <circle cx="10" cy="10" r="9" fill="var(--gold)"/>
        <circle cx="22" cy="10" r="9" fill="var(--teal)" fill-opacity=".9"/>
      </svg>
      <span>SkillBarter</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="dashboard.html">Dashboard</a>
      <a href="search.html" aria-current="page">Find students</a>
      <a href="requests.html">Requests <span class="count" id="nav-count" hidden></span></a>
      <a href="profile.html">Profile</a>
      <button type="button" class="linklike" id="logout">Log out</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="flash"></div>

  <section class="page-head">
    <h1>Find students</h1>
    <!-- A normal GET form: submitting it reloads this page as search.html?q=... -->
    <form class="inline-form search-form" action="search.html" method="get" role="search">
      <label class="grow"><span class="sr">Search by skill or name</span>
        <input type="search" name="q" id="q" placeholder="Search a skill or a name, like Photoshop" maxlength="60">
      </label>
      <button type="submit" class="btn btn-small">Search</button>
      <a class="btn btn-small btn-ghost" id="clear" href="search.html" hidden>Clear</a>
    </form>
  </section>

  <div id="no-skill-note" class="flash flash-info" hidden>To send a request you need something to teach in return. <a href="dashboard.html">Add a skill you can teach</a>.</div>

  <div id="results" class="results"></div>
  <p id="empty" class="empty" hidden></p>
</main>

<footer class="foot wrap">
  <p>Made for students who learn better together.</p>
</footer>

<script src="js/common.js"></script>
<script src="js/search.js"></script>
</body>
</html>
