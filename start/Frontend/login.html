<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | SkillBarter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="index.html">
      <svg class="logo-mark" viewBox="0 0 32 20" width="32" height="20" aria-hidden="true">
        <circle cx="10" cy="10" r="9" fill="var(--gold)"/>
        <circle cx="22" cy="10" r="9" fill="var(--teal)" fill-opacity=".9"/>
      </svg>
      <span>SkillBarter</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="login.html" aria-current="page">Log in</a>
      <a class="btn btn-small" href="register.html">Create account</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="flash"></div>

  <section class="auth">
    <h1>Log in</h1>
    <form class="form" id="login-form" novalidate>
      <p class="flash flash-err" role="alert" data-error hidden></p>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn">Log in</button>
    </form>

    
    <p class="muted">New here? <a href="register.html">Create an account</a></p>
  </section>
</main>

<footer class="foot wrap">
  <p>Made for students who learn better together.</p>
</footer>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
